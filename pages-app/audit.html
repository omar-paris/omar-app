</main><script>
(function(){
  const acts = [
    {id:'rencontre', label:'On fait connaissance', steps:['pacte','identity_public_context','public_sources_consent','activity_business_model','person_and_goals']},
    {id:'plongee', label:'On entre dans le concret', steps:['operations_week','marketing_sales','admin_finance_purchasing','hr_team_organization','digital_tools_data','risks_limits']},
    {id:'livraison', label:'Votre diagnostic', steps:['diagnosis','recommendations','validation']}
  ];
  const steps = [
    {id:'pacte', label:'Démarrage', fallback:'Bonjour, moi c’est Omar. À travers plusieurs questions, nous allons explorer votre activité et terminer avec un diagnostic Business & Tech complet, proposé sous forme de plusieurs documents.'},
    {id:'identity_public_context', label:'Identité', fallback:'Commençons simple : le nom de votre entreprise et votre ville ?'},
    {id:'public_sources_consent', label:'Sources publiques', fallback:'Vous m’autorisez à regarder quelles sources publiques ?'},
    {id:'activity_business_model', label:'Activité', fallback:'Racontez-moi votre activité simplement : métier, ville, équipe.'},

    {id:'diagnosis', label:'Diagnostic', fallback:'Voilà ce que je vois pour vous. Dites-moi si je vise juste.'},
    {id:'recommendations', label:'Priorités', fallback:'Classez les recommandations qui vous parlent.'},
    {id:'validation', label:'Synthèse finale', fallback:'Dernière étape : vérifiez-moi tout. Ensuite votre rapport est à vous.'}
  ];
  const intro = steps[0];
  const state = {current:'pacte', sessionId:null, answers:{}, validated:{}, skipped:{}, runtimeScope:['pacte','identity_public_context','public_sources_consent','activity_business_model','person_and_goals','operations_week','admin_finance_purchasing','digital_tools_data','risks_limits','diagnosis','recommendations','validation'], transcript:[], busy:false, reportReady:false, auditId:null, share:null,lastOmar:null,lastSynthesis:null, savePromptDismissed:false,researchPrompted:false,researchDone:false,pendingAfterResearch:null,publicResearch:null};

  function visibleIndex(stepId){return steps.findIndex(s=>s.id===stepId)}
  function currentStep(){return steps.find(s=>s.id===state.current) || intro}
  function compact(text, fallback, max=120){const raw=String(text||'').trim().replace(/\s+/g,' '); if(!raw) return fallback; return raw.length>max ? raw.slice(0,max-1)+'…' : raw}
  function setBusy(on){state.busy=on; $('send').disabled=on; $('chat-state').innerHTML=on?'<span class="typing"><span></span><span></span><span></span></span>':'en ligne'}
  function addBubble(role, text, type){
    state.transcript.push({role, text, step: state.current, at: new Date().toISOString()});
    const node=document.createElement('div');
    if(type==='system'){node.className='bubble system'; node.textContent=text}
    else{node.className=`row ${role==='client'?'client':'omar'}`; if(role==='omar'){const av=document.createElement('img'); av.className='avatar'; av.src='/pages-app/assets/omar-headshot.webp'; av.alt=''; av.width=60; av.height=60; node.appendChild(av)} const b=document.createElement('div'); b.className=`bubble ${role==='client'?'client':'omar'}`; b.textContent=text; node.appendChild(b)}
    $('chat-log').appendChild(node); node.scrollIntoView({block:'end', behavior:'smooth'});
  }
  function currentAct(){return acts.find(a=>a.steps.includes(state.current)) || acts[0]}
  function renderSteps(){
    const validated=state.validated||{};
    const skipped=state.skipped||{};
    const scope=state.runtimeScope||steps.map(s=>s.id);
    const currentIdx=visibleIndex(state.current);
    $('acts').innerHTML='';
    $('steps').innerHTML=acts.map(act=>{
      const rows=act.steps.map(id=>{
        const step=steps.find(s=>s.id===id) || {id,label:id};
        const idx=visibleIndex(id);
        const inScope=scope.includes(id);
        const cls=validated[id]?'done':(skipped[id]?'skipped':(id===state.current?'current':(idx>currentIdx?'future':'')));

        return `<div class="step ${cls} ${inScope?'':'optional'}" title="${esc(inScope?'Parcours V0':'Sous-partie prévue, fusionnée ou conditionnelle')}"><i>${esc(mark)}</i><span>${esc(step.label)}</span></div>`;
      }).join('');
      return `<section class="act-group"><div class="act-label">${esc(act.label)}</div>${rows}</section>`;
    }).join('');
    const doneCount=scope.filter(id=>validated[id]).length;
    $('progress-bar').style.width=Math.round((doneCount/Math.max(1,scope.length))*100)+'%';
    const pc=$('progress-count'); if(pc) pc.textContent=`${doneCount}/${scope.length}`;
  }
  function render(){renderSteps(); renderQuickReplies();}
  const stepGuides={
    pacte:{

    identity_public_context:{

      challenge:'Ce qu’il faut clarifier ici : nom public, ville ou zone servie, et si l’entreprise a plusieurs établissements. Le SIRET aide, mais n’est pas obligatoire.',
      unknown:'Pas grave. Donnez-moi seulement le nom que vos clients utilisent et la ville principale. On corrigera ensuite.',
      replies:[['Je donne nom + ville','focus'],['Voir un exemple','help'],['Pourquoi utile ?','value'],['Je n’ai pas le SIRET','unknown']]

    public_sources_consent:{
      example:'Réponse possible : “Oui pour SIRENE et mon site, non pour les réseaux” ou “Non, on continue uniquement avec mes réponses”.',

      challenge:'À décider : registre légal, site web, fiche Google, réseaux sociaux, documents publics. Rien n’est consulté sans accord explicite.',
      unknown:'Vous pouvez refuser maintenant. Le diagnostic continuera avec vos réponses, sans prétendre avoir vérifié publiquement.',
      replies:[['Oui, sources publiques','answer'],['Non, sans recherche','answer'],['Quelles sources ?','challenge'],['Pourquoi utile ?','value']]
    },
    activity_business_model:{
      example:'Exemple : “Je suis plombier à Nantes, surtout particuliers, 3 personnes, devis par téléphone et Google.”',
      value:'Pourquoi c’est utile : avant de parler IA ou outils, il faut comprendre comment l’argent rentre, qui achète, et où une automatisation peut vraiment aider.',
      challenge:'Les points clés : métier réel, clients principaux, taille d’équipe, canaux de vente, saisonnalité éventuelle, prestations rentables ou pénibles.',
      unknown:'Répondez comme à un voisin. Même une phrase imparfaite suffit : métier, clients, taille, comment on vous contacte.',
      replies:[['Décrire métier + clients','focus'],['Voir un exemple','help'],['Pourquoi utile ?','value'],['Aidez-moi à formuler','unknown']]
    },
    person_and_goals:{
      example:'Exemple : “Je veux gagner 5h par semaine, arrêter les relances le soir, mieux suivre les demandes et préparer l’embauche.”',
      value:'Pourquoi c’est utile : deux entreprises identiques peuvent avoir des solutions opposées selon le dirigeant — croissance, temps libre, transmission, stabilité.',
      challenge:'On cherche votre vrai cap : tenir, grandir, déléguer, réduire la charge mentale, mieux piloter, ou préparer une nouvelle étape.',
      unknown:'Si c’est flou, dites seulement ce qui vous fatigue le plus et ce que vous aimeriez ne plus gérer dans 6 mois.',
      replies:[['Décrire mes objectifs','focus'],['Voir un exemple','help'],['Pourquoi utile ?','value'],['Aidez-moi','unknown']]
    },

      example:'Exemple : “Lundi devis, mardi relances, mercredi planning, jeudi appels clients, vendredi factures. Le pire : répondre aux mêmes questions.”',
      value:'Pourquoi c’est utile : la vraie semaine révèle les irritants, pas l’organigramme. C’est là qu’on trouve les routines candidates pour un agent utile.',

    },
    marketing_sales:{
      example:'Exemple : “Les clients viennent par Google et bouche à oreille. Je perds surtout ceux qui demandent un devis quand je réponds trop tard.”',

  async function api(path, payload){

    return data;
  }

  function summarizePublicResearch(result){
    if(!result) return 'Recherche publique terminée : aucune donnée exploitable retournée.';
    const facts=(result.facts||[]).slice(0,3).map(f=>String(f.value||f.label||'').trim()).filter(Boolean);
    const missing=(result.not_executed||[]).slice(0,2).map(x=>String(x.label||x.reason||'source non exécutée')).filter(Boolean);
    if(facts.length) return `J’ai trouvé ces éléments publics à valider : ${facts.join(' / ')}. Je ne les utiliserai comme faits vérifiés que si vous confirmez.`;
    if(missing.length) return `Recherche publique lancée, mais je n’ai pas encore de fait fiable automatique. Sources non exploitées : ${missing.join(', ')}. Validez si l’on continue sans fait public vérifié.`;
    return 'Recherche publique lancée, mais aucun fait fiable n’a été récupéré automatiquement. Je peux continuer avec vos déclarations, sans prétendre avoir vérifié.';
  }
  function buildOmarMiniStory(result){
    const verified=(result&&result.facts||[]).slice(0,2).map(f=>String(f.value||f.label||'').trim()).filter(Boolean);
    const notRun=(result&&result.not_executed||[]).slice(0,2).map(x=>String(x.label||x.reason||'source non exécutée')).filter(Boolean);
    const declared=compact(state.answers.identity_public_context||state.answers.activity_business_model||'', 'votre activité telle que vous me l’avez déclarée', 150);
    const parts=[`Récit Omar à valider : je pars de ${declared}.`];
    if(verified.length){parts.push(`Côté public, je retiens seulement après votre accord : ${verified.join(' / ')}.`)}
    else{parts.push('Côté public, je ne retiens encore aucun fait vérifié automatiquement.')}
    if(notRun.length){parts.push(`Sources non exécutées ou à vérifier manuellement : ${notRun.join(', ')}.`)}
    parts.push('Validez ce mini-récit, corrigez-le, ou ignorez les sources avant que je continue.');
    return parts.join('\n\n');
  }

  async function tryAdvance(stepId){

      syncSession(data.session); addBubble('omar', `✓ ${currentStepLabel(stepId)} validé.`, 'system');

      if(allVisibleStepsDone()){await generateReport(); return true}
      ask(data.next); return true;
    }catch(error){return false}
  }

    const verified=(state.publicResearch&&state.publicResearch.facts||[]).slice(0,3).map(f=>`<li>${esc(f.value)} <small>source publique · confiance ${esc(f.confidence||'')}</small></li>`).join('') || '<li>Aucune source publique vérifiée automatiquement, ou recherche refusée.</li>';
    const evidence=`<p><strong>Contrat de preuve</strong></p><ul><li>Déclaré client : vos réponses ci-dessus.</li><li>Vérifié public : seulement les éléments sourcés listés.</li><li>Hypothèses Omar : séparées ci-dessous, à valider.</li><li>Inconnu : ce qui manque reste non inventé.</li></ul>`;
    $('audit-result').innerHTML=`<button type="button" class="report-close" aria-label="Fermer le rapport">Fermer</button><h3>${esc(r.title||'Rapport audit')}</h3><p>${esc(r.summary||'Rapport généré à partir de la conversation.')}</p><p><strong>Ce que vous m’avez dit</strong></p><ul>${declared}</ul><p><strong>Vérifié publiquement</strong></p><ul>${verified}</ul>${evidence}<p><strong>Mes hypothèses</strong></p><ul>${hypo}</ul><p><strong>Ce qu’il ne faut PAS automatiser</strong></p><ul>${noauto}</ul><p><strong>Prochaines actions</strong></p><ul>${next}</ul><p class="status">Audit ${esc(state.auditId||'local')} généré. Aucun paiement ni provisioning déclenché.</p><div class="result-cta"><strong>Sauvegarder et recevoir ce rapport</strong><span>Connectez-vous pour enregistrer l’audit, le recevoir par email, le reprendre plus tard et ouvrir l’étape devis.</span><a href="/oauth2/start?rd=/audit/">Se connecter / sauvegarder l’audit</a><span class="devis-locked">Le devis est volontairement réservé aux personnes enregistrées : cela sécurise l’envoi, le suivi et l’étape paiement.</span></div>`;
    $('audit-result').classList.add('visible'); const close=$('audit-result').querySelector('.report-close'); if(close){close.onclick=()=>$('audit-result').classList.remove('visible')}; $('audit-status').textContent='Rapport généré depuis la conversation, ouvert en document lisible.'; render();
  }
  function renderJ1terDocuments(documents){
    if(!documents) return;
    const audit=documents.structured_audit||{};
    const profile=audit.profile||{};
    const open=(documents.open_questions||[]).slice(0,4).map(x=>`<li>${esc(x)}</li>`).join('') || '<li>Aucune question critique restante dans le périmètre V0.</li>';
    const gates=((documents.agent_profile&&documents.agent_profile.human_gates)||[]).slice(0,3).map(x=>`<li>${esc(x)}</li>`).join('') || '<li>Validation humaine avant action externe sensible.</li>';
    const html=`<section class="understanding visible"><h3>Documents fondateurs générés</h3><dl><dt>Audit structuré</dt><dd>${esc(profile.activity||'Activité à préciser')} · secteur ${esc(profile.sector_id||'generic_tpe')}</dd><dt>Manifeste business</dt><dd>${esc(compact(documents.manifest_business||'', 'Manifeste généré', 220))}</dd><dt>Identité dirigeant</dt><dd>Maturité digitale : ${esc((documents.owner_identity&&documents.owner_identity.digital_maturity)||'à préciser')}</dd><dt>Profil agent</dt><dd>${esc((documents.agent_profile&&documents.agent_profile.role)||'assistant IA opérationnel')}</dd><dt>Human gates</dt><dd><ul>${gates}</ul></dd><dt>Questions restantes</dt><dd><ul>${open}</ul></dd></dl></section>`;
    $('audit-result').insertAdjacentHTML('beforeend', html);
  }
  async function loadJ1terDocuments(){
    if(!state.sessionId) return null;
    try{const data=await apiGet(`/api/audit-sessions/${state.sessionId}/documents`); renderJ1terDocuments(data.documents); return data.documents}
    catch(error){console.warn('documents J1-ter indisponibles', error); return null}
  }
  async function createDevisFromAudit(){
    if(!state.auditId) return null;
    const data=await api('/api/devis',{audit_id:state.auditId});
    state.devis=data.devis;
    return data.devis;
  }
  function devisHtml(devis){
    if(!devis) return '<p class="status">Devis non généré.</p>';
    const lines=(devis.lignes||[]).map(line=>`<li><strong>${esc(line.label||line.id)}</strong> — ${esc(line.prix_mensuel!=null?`${line.prix_mensuel} EUR/mois`:line.prix_unique!=null?`${line.prix_unique} EUR setup`:'sur devis')} <span class="status">${esc((line.justification&&line.justification.reason)||'à valider')}</span></li>`).join('');
    const email=(devis.client&&devis.client.email)?` · prospect ${esc(devis.client.email)}`:'';
    return `<section class="understanding visible"><h3>Proposition de devis</h3><p><strong>${esc(devis.total_mensuel_eur)} EUR/mois HT</strong> + ${esc(devis.total_unique_eur)} EUR initial HT · statut ${esc(devis.statut)}${email}.</p><ul>${lines}</ul><p class="status">Base d’entrée Omar & Alex : 67 EUR/mois. Aucun paiement en ligne n’est lancé ici ; le devis reste à valider humainement.</p></section>`;
  }
  async function generateReport(){
    if(state.reportReady) return; $('audit-status').textContent='Génération du rapport…';
    try{
      const data=state.sessionId ? await api(`/api/audit-sessions/${state.sessionId}/report`, buildFallbackPayload()) : await api('/api/audits', buildFallbackPayload());
      setBusy(false); renderReport(data); await loadJ1terDocuments();
      try{const devis=await createDevisFromAudit(); if(devis){$('audit-result').insertAdjacentHTML('beforeend', devisHtml(devis)); $('audit-status').textContent='Rapport généré, lead prospect tracé si connecté, devis proposé.';}}
      catch(devisError){$('audit-status').textContent=`Rapport généré, devis à reprendre : ${devisError.message}`;}
    }
    catch(error){setBusy(false); $('audit-status').textContent=`Rapport non généré : ${error.message}. La conversation reste enregistrée localement.`}
  }
  function autoResize(){const el=$('reply'); el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,150)+'px'}
  $('composer-form').addEventListener('submit', e=>{e.preventDefault(); userSend()});
  $('reply').addEventListener('input', autoResize); $('reply').addEventListener('keydown', e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); userSend()}});
  startSession(); render();
})();
</script><footer class="sr-only">Omar App · app.omar.paris · V0.5.0 · Audit Business Tech V1 · audit_business_tech_tree_v1 · /api/audit-sessions</footer></body></html>
